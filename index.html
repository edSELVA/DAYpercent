<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DAYpercent</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DAYpercent">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="author" content="edSELVA &amp; TOTI">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Un sol objecte centrat; el fons segueix la llum del dia (el JS reescriu els tokens) */
:root { --sky: #181C27; --ink: #F1ECE2; --dim: .18; --ghost: .04; color-scheme: dark; }
html, body { height: 100%; }
body {
  margin: 0; box-sizing: border-box;
  background: var(--sky); color: var(--ink);
  display: grid; place-items: center;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
svg { width: min(64vw, 280px); height: auto; max-width: 100%; overflow: visible; }
.dim { opacity: var(--dim); }
.ghost { opacity: var(--ghost); }
footer {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
  text-align: center; font: 500 11px/1 system-ui, sans-serif; letter-spacing: .12em;
  color: var(--ink); opacity: var(--dim);
}
</style>
</head>
<body>
<svg viewBox="0 0 200 200" aria-hidden="true">
  <!-- Corona estriada a les 3, del to de l'anell pendent -->
  <!-- Pista i corona en un sol grup: la transparència s'aplica una vegada i no es sumen on es toquen -->
  <g class="dim">
    <g fill="var(--ink)">
      <rect x="174" y="93" width="7" height="14"/>
      <rect x="181" y="86" width="12" height="28" rx="2.5"/>
    </g>
    <circle cx="100" cy="100" r="70" fill="none" stroke="var(--ink)" stroke-width="14"/>
  </g>
  <g id="ridges" stroke="var(--sky)" stroke-width="1.4"></g>
  <circle id="arc" cx="100" cy="100" r="70" fill="none" stroke="var(--ink)" stroke-width="14"
          stroke-linecap="round" transform="rotate(-90 100 100)"/>
  <g id="lcd" fill="var(--ink)"></g>
  <g id="dec" fill="var(--ink)"></g>
</svg>

<footer>DAYpercent by edSELVA &amp; TOTI</footer>

<script>
const R = 70, LEN = 2 * Math.PI * R;
const arc = document.getElementById('arc');
arc.setAttribute('stroke-dasharray', `0 ${LEN}`);
document.getElementById('ridges').innerHTML =
  [92, 97.5, 103, 108.5].map(y => `<line x1="181" y1="${y}" x2="193" y2="${y}"/>`).join('');

// Xifres de set segments, com les pantalles de cristall líquid de Casio.
// BIG és el número principal; SMALL, els decimals de sota.
const BIG = { W: 32.7, H: 56.8, T: 6.9, GAP: 10.3, TOP: 100 - 56.8 / 2 };
const SMALL = { W: 8.5, H: 14, T: 2.2, GAP: 3, TOP: 140 };
const DIGITS = ['abcdef', 'bc', 'abged', 'abgcd', 'fgbc', 'afgcd', 'afgedc', 'abc', 'abcdefg', 'abcdfg'];
function seg(x, y, dir, { W, H, T }) {
  const h = T / 2, k = T * 0.15;
  const pts = dir === 'h'
    ? [[x + k, y], [x + h + k, y - h], [x + W - h - k, y - h], [x + W - k, y], [x + W - h - k, y + h], [x + h + k, y + h]]
    : [[x, y + k], [x + h, y + h + k], [x + h, y + H / 2 - h - k], [x, y + H / 2 - k], [x - h, y + H / 2 - h - k], [x - h, y + h + k]];
  return pts.map(p => p.join(',')).join(' ');
}
function lcd(str, g) {
  const { W, H, GAP, TOP } = g;
  const segs = { a: [0, 0, 'h'], g: [0, H / 2, 'h'], d: [0, H, 'h'],
                 f: [0, 0, 'v'], b: [W, 0, 'v'], e: [0, H / 2, 'v'], c: [W, H / 2, 'v'] };
  const total = str.length * W + (str.length - 1) * GAP;
  let on = '', off = '';
  [...str].forEach((ch, i) => {
    const x0 = 100 - total / 2 + i * (W + GAP);
    for (const [name, [dx, dy, dir]] of Object.entries(segs)) {
      const poly = `<polygon points="${seg(x0 + dx, TOP + dy, dir, g)}"/>`;
      if (ch !== ' ' && DIGITS[+ch].includes(name)) on += poly; else off += poly;
    }
  });
  // Segments apagats encara més suaus que l'anell pendent, com un 8 fantasma
  return `<g transform="skewX(-6) translate(${(TOP + H / 2) * Math.tan(6 * Math.PI / 180)},0)"><g class="ghost">${off}</g>${on}</g>`;
}

// Franges del dia segons l'alçada del sol sobre l'horitzó, calculada per a Vic.
// Així l'hora blava i l'hora daurada segueixen la sortida i la posta de cada dia de l'any.
// Color de fons i opacitats de l'anell pendent i dels segments apagats:
// com més clar és el fons, més opacitat cal perquè es vegin igual que de nit.
const LAT = 41.93, LON = 2.25;
const NIT = ['#181C27', .18, .04], BLAVA = ['#22306E', .24, .06],
      DAURADA = ['#E09A5C', .30, .09], DIA = ['#9DB6BF', .34, .11];
// [alçada del sol en graus, franja]: hora blava entre -7° i -4°, daurada entre -1° i 4°
const SKY = [
  [-90, NIT], [-10, NIT], [-7, BLAVA], [-4, BLAVA], [-1, DAURADA], [4, DAURADA], [8, DIA], [90, DIA],
];
const RAD = Math.PI / 180;
function sunAltitude(date) {
  const d = date / 864e5 - 10957.5;                      // dies des de l'1 de gener del 2000 a les 12:00 UTC
  const g = (357.529 + 0.98560028 * d) * RAD;            // anomalia mitjana
  const L = (280.459 + 0.98564736 * d + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * RAD;
  const e = (23.439 - 0.00000036 * d) * RAD;             // inclinació de l'eix
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  const ha = (280.46061837 + 360.98564736629 * d + LON) * RAD - ra;
  return Math.asin(Math.sin(LAT * RAD) * Math.sin(dec) + Math.cos(LAT * RAD) * Math.cos(dec) * Math.cos(ha)) / RAD;
}
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const lerp = (a, b, e) => a + (b - a) * e;
function sky(alt) {
  let i = 0; while (SKY[i + 1][0] <= alt) i++;
  const [a0, [c0, d0, g0]] = SKY[i], [a1, [c1, d1, g1]] = SKY[i + 1];
  const t = (alt - a0) / (a1 - a0), e = t * t * (3 - 2 * t);
  const A = hex(c0), B = hex(c1);
  return { rgb: A.map((v, k) => Math.round(lerp(v, B[k], e))), dim: lerp(d0, d1, e), ghost: lerp(g0, g1, e) };
}

const root = document.documentElement.style;
let shown = '', shownDec = '';

function tick() {
  const now = new Date();
  const start = new Date(now); start.setHours(0, 0, 0, 0);
  const end = new Date(start); end.setDate(end.getDate() + 1);
  const f = (now - start) / (end - start);

  arc.setAttribute('stroke-dasharray', `${f * LEN} ${LEN}`);
  // Sempre dues caselles: amb un sol dígit, la de l'esquerra queda apagada
  const label = String(Math.floor(f * 100)).padStart(2, ' ');
  if (label !== shown) { document.getElementById('lcd').innerHTML = lcd(label, BIG); shown = label; }
  // Dècimes i centèsimes del percentatge: l'última xifra canvia cada 8,6 s
  const dec = String(Math.floor(f * 10000) % 100).padStart(2, '0');
  if (dec !== shownDec) { document.getElementById('dec').innerHTML = lcd(dec, SMALL); shownDec = dec; }

  const { rgb: [r, g, b], dim, ghost } = sky(sunAltitude(now));
  root.setProperty('--sky', `rgb(${r},${g},${b})`);
  root.setProperty('--dim', dim.toFixed(3));
  root.setProperty('--ghost', ghost.toFixed(3));
  root.setProperty('--ink', (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.55 ? '#1E2230' : '#F1ECE2');
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
