<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DAYpercent</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DAYpercent">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="author" content="edSELVA">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Un sol objecte centrat; el fons segueix la llum del dia (el JS reescriu els tokens) */
:root { --sky: #181C27; --ink: #F1ECE2; color-scheme: dark; }
html, body { height: 100%; }
body {
  margin: 0; box-sizing: border-box;
  background: var(--sky); color: var(--ink);
  display: grid; place-items: center;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
svg { width: min(64vw, 280px); height: auto; max-width: 100%; overflow: visible; }
.dim { opacity: .18; }
footer {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
  text-align: center; font: 500 11px/1 system-ui, sans-serif; letter-spacing: .12em;
  color: var(--ink); opacity: .18;
}
</style>
</head>
<body>
<svg viewBox="0 0 200 200" aria-hidden="true">
  <!-- Corona estriada a les 3, del to de l'anell pendent -->
  <g class="dim" fill="var(--ink)">
    <rect x="174" y="93" width="7" height="14"/>
    <rect x="181" y="86" width="12" height="28" rx="2.5"/>
  </g>
  <g id="ridges" stroke="var(--sky)" stroke-width="1.4"></g>
  <circle class="dim" cx="100" cy="100" r="70" fill="none" stroke="var(--ink)" stroke-width="14"/>
  <circle id="arc" cx="100" cy="100" r="70" fill="none" stroke="var(--ink)" stroke-width="14"
          stroke-linecap="round" transform="rotate(-90 100 100)"/>
  <g id="lcd" fill="var(--ink)"></g>
</svg>

<footer>DAYpercent by edSELVA</footer>

<script>
const R = 70, LEN = 2 * Math.PI * R;
const arc = document.getElementById('arc');
arc.setAttribute('stroke-dasharray', `0 ${LEN}`);
document.getElementById('ridges').innerHTML =
  [92, 97.5, 103, 108.5].map(y => `<line x1="181" y1="${y}" x2="193" y2="${y}"/>`).join('');

// Xifres de set segments, com les pantalles de cristall líquid de Casio
const W = 38, H = 66, T = 8, GAP = 12, TOP = 100 - H / 2;
const SEGS = {
  a: [0, 0, 'h'], g: [0, H / 2, 'h'], d: [0, H, 'h'],
  f: [0, 0, 'v'], b: [W, 0, 'v'], e: [0, H / 2, 'v'], c: [W, H / 2, 'v'],
};
const DIGITS = ['abcdef', 'bc', 'abged', 'abgcd', 'fgbc', 'afgcd', 'afgedc', 'abc', 'abcdefg', 'abcdfg'];
function seg(x, y, dir) {
  const h = T / 2, k = 1.2;
  const pts = dir === 'h'
    ? [[x + k, y], [x + h + k, y - h], [x + W - h - k, y - h], [x + W - k, y], [x + W - h - k, y + h], [x + h + k, y + h]]
    : [[x, y + k], [x + h, y + h + k], [x + h, y + H / 2 - h - k], [x, y + H / 2 - k], [x - h, y + H / 2 - h - k], [x - h, y + h + k]];
  return pts.map(p => p.join(',')).join(' ');
}
function lcd(str) {
  const total = str.length * W + (str.length - 1) * GAP;
  let out = '';
  [...str].forEach((ch, i) => {
    const x0 = 100 - total / 2 + i * (W + GAP);
    for (const [name, [dx, dy, dir]] of Object.entries(SEGS))
      if (DIGITS[+ch].includes(name)) out += `<polygon points="${seg(x0 + dx, TOP + dy, dir)}"/>`;
  });
  return `<g transform="skewX(-6) translate(${100 * Math.tan(6 * Math.PI / 180)},0)">${out}</g>`;
}

// Franges del dia: [hora, color]. Entre punts, el color es barreja suaument.
const NIT = '#181C27', BLAVA = '#22306E', DAURADA = '#E09A5C', DIA = '#9DB6BF';
const SKY = [
  [0, NIT], [5.5, NIT], [6.2, BLAVA], [6.9, BLAVA], [7.4, DAURADA], [8.6, DAURADA],
  [9.6, DIA], [17, DIA], [18, DAURADA], [19.2, DAURADA], [19.7, BLAVA], [20.4, BLAVA],
  [21.2, NIT], [24, NIT],
];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function sky(h) {
  let i = 0; while (SKY[i + 1][0] <= h) i++;
  const [h0, c0] = SKY[i], [h1, c1] = SKY[i + 1];
  const t = (h - h0) / (h1 - h0), e = t * t * (3 - 2 * t);
  const A = hex(c0), B = hex(c1);
  return A.map((v, k) => Math.round(v + (B[k] - v) * e));
}

const root = document.documentElement.style;
let shown = '';

function tick() {
  const now = new Date();
  const start = new Date(now); start.setHours(0, 0, 0, 0);
  const end = new Date(start); end.setDate(end.getDate() + 1);
  const f = (now - start) / (end - start);

  arc.setAttribute('stroke-dasharray', `${f * LEN} ${LEN}`);
  const label = String(Math.floor(f * 100));
  if (label !== shown) { document.getElementById('lcd').innerHTML = lcd(label); shown = label; }

  const [r, g, b] = sky(f * 24);
  root.setProperty('--sky', `rgb(${r},${g},${b})`);
  root.setProperty('--ink', (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.55 ? '#1E2230' : '#F1ECE2');
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
